#cloud-config
# Cloud-Init für KN04-Web (Web-Server)

users:
  - name: ubuntu
    sudo: ALL=(ALL) NOPASSWD:ALL
    groups: users, admin
    shell: /bin/bash
    ssh_authorized_keys:
      - ssh-rsa  aws-key
      - ssh-rsa  teacher-key

ssh_pwauth: false
disable_root: false

package_update: true
packages:
  - apache2
  - php
  - libapache2-mod-php
  - php-mysql
  - adminer

write_files:
  - path: /var/www/html/info.php
    content: |
      <?php
      phpinfo();
      ?>

  - path: /var/www/html/db.php
    content: |
      <?php
      $servername = "172.31.66.95";  // Private IP von KN04-DB
      $username = "admin";
      $password = "admin";
      $dbname = "mysql";

      $conn = new mysqli($servername, $username, $password, $dbname);

      if ($conn->connect_error) {
          die("Connection failed: " . $conn->connect_error);
      }

      echo "<h1>Database Connection Successful!</h1>";
      echo "<p>Connected to database on " . $servername . "</p>";

      $sql = "SELECT User, Host FROM mysql.user";
      $result = $conn->query($sql);

      if ($result->num_rows > 0) {
          echo "<table border='1'><tr><th>User</th><th>Host</th></tr>";
          while($row = $result->fetch_assoc()) {
              echo "<tr><td>" . $row["User"]. "</td><td>" . $row["Host"]. "</td></tr>";
          }
          echo "</table>";
      }
      $conn->close();
      ?>

runcmd:
  # Aktiviert Adminer
  - sudo a2enconf adminer
  # Startet Apache neu
  - sudo systemctl restart apache2
