#cloud-config
# Cloud-Init Beispiel-Datei für Teil A

users:
  - name: ubuntu                    # Benutzername
    groups: [users, admin]          # Gruppenmitgliedschaft
    shell: /bin/bash                # Standard-Shell
    sudo: ALL=(ALL) NOPASSWD:ALL    # Sudo-Rechte ohne Passwort
    ssh_authorized_keys:
      - ssh-rsa  aws-key

ssh_pwauth: false                  # Deaktiviert Passwort-Login über SSH
disable_root: false                 # Root-Benutzer bleibt aktiv

package_update: true                # Führt apt update aus

packages:                           # Zu installierende Pakete
  - curl                            # HTTP-Request Tool
  - wget                            # Download Tool
