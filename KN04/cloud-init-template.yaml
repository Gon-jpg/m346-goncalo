#cloud-config
# Cloud-Init Template für Teil C: Beide Keys (eigener + Lehrperson)

users:
  - name: ubuntu
    sudo: ALL=(ALL) NOPASSWD:ALL
    groups: users, admin
    shell: /bin/bash
    ssh_authorized_keys:
      # Mein Key (vorname1)
      - ssh-rsa  aws-key
      # Lehrer Key
      - ssh-rsa  teacher-key

ssh_pwauth: false
disable_root: false

package_update: true
packages:
  - curl
  - wget
